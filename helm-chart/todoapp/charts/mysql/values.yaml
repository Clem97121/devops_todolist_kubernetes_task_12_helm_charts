common:
  namespace: mysql

mysql:

  image:
    name: mysql
    repository: mysql
    version: 8.0

  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"

  replicas: 2

  pvc:
    requests:
      storage: 2Gi

  affinity:
    podAntiAffinity:
      key: "app"
      values: mysql
    nodeAffinity:
      key: "app"
      values: "mysql"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi